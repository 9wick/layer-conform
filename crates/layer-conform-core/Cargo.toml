[dependencies]
compact_str.workspace = true
smallvec.workspace = true
blake3.workspace = true
thiserror.workspace = true
globset.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[badges]
maintenance = { status = "experimental" }
