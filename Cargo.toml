[workspace]
resolver = "2"
members = [
    "crates/layer-conform-core",
    "crates/layer-conform-io",
    "crates/layer-conform-ts",
    "crates/layer-conform-rs",
    "crates/layer-conform",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"
authors = ["KoheiKido <kido@9wick.com>"]
repository = "https://github.com/9wick/layer-conform"
homepage = "https://github.com/9wick/layer-conform"

[workspace.dependencies]
# Internal crates
layer-conform-core = { version = "0.1.0", path = "crates/layer-conform-core" }
layer-conform-io = { version = "0.1.0", path = "crates/layer-conform-io" }
layer-conform-ts = { version = "0.1.0", path = "crates/layer-conform-ts" }
layer-conform-rs = { version = "0.1.0", path = "crates/layer-conform-rs" }

# External (exact pin で固定)
oxc_parser = "=0.73.0"
oxc_ast = "=0.73.0"
oxc_allocator = "=0.73.0"
oxc_span = "=0.73.0"
syn = { version = "=2.0.87", features = ["full"] }
toml = "=0.8.23"

clap = { version = "=4.5.21", features = ["derive"] }
serde = { version = "=1.0.215", features = ["derive"] }
serde_json = "=1.0.133"
anyhow = "=1.0.94"
thiserror = "=2.0.6"
compact_str = { version = "=0.8.1", features = ["serde"] }
smallvec = { version = "=1.13.2", features = ["serde", "union"] }
blake3 = "=1.5.5"
globset = "=0.4.15"
ignore = "=0.4.23"
walkdir = "=2.5.0"

# Dev
assert_cmd = "=2.0.16"
predicates = "=3.1.3"
tempfile = "=3.14.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
